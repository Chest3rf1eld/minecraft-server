name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          first_line=$(head -n 1 ~/.ssh/deploy_key)
          case "$first_line" in
            "-----BEGIN "*" PRIVATE KEY-----") ;;
            *) echo "VPS_SSH_KEY is not an OpenSSH/PEM private key (first line: ${first_line:0:32})"; exit 1 ;;
          esac
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Request deployment
        run: |
          tar --exclude='.git' --exclude='.opencode' -czf /tmp/minecraft-infra.tgz .
          scp -i ~/.ssh/deploy_key /tmp/minecraft-infra.tgz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/minecraft-infra.tgz"
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo mkdir -p /srv/minecraft/repo && sudo tar -xzf /tmp/minecraft-infra.tgz -C /srv/minecraft/repo && sudo chown -R root:root /srv/minecraft/repo'
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo install -d -m 0700 /etc/minecraft/secrets'
          printf '%s' "${{ secrets.RCON_PASSWORD }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/rcon_password >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/rcon_password'
          printf '%s' "${{ secrets.RESTIC_PASSWORD }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/restic_password >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/restic_password'
          printf '%s' "${{ secrets.TELEGRAM_BOT_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/telegram_bot_token >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/telegram_bot_token'
          printf '%s' "${{ secrets.TELEGRAM_CHAT_ID }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/telegram_chat_id >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/telegram_chat_id'
          printf '%s' "${{ secrets.HEALTHCHECKS_BACKUP_URL }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/healthchecks_backup_url >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/healthchecks_backup_url'
          printf '%s' "${{ secrets.HEALTHCHECKS_VPS_URL }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/healthchecks_vps_url >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/healthchecks_vps_url'
          printf '%s' "${{ secrets.YANDEX_RCLONE_CONFIG }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo tee /etc/minecraft/secrets/rclone.conf >/dev/null && sudo chmod 0600 /etc/minecraft/secrets/rclone.conf'
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo cp /srv/minecraft/repo/scripts/*.sh /opt/minecraft/bin/ && sudo cp /srv/minecraft/repo/scripts/*.py /opt/minecraft/bin/ && sudo chmod 0755 /opt/minecraft/bin/* && sudo cp /srv/minecraft/repo/systemd/* /etc/systemd/system/ && sudo systemctl daemon-reload && cd /srv/minecraft/repo && sudo /opt/minecraft/bin/prepare-release.sh && sudo systemctl start --no-block minecraft-deploy.service && for i in $(seq 1 120); do state=$(sudo systemctl show -p ActiveState --value minecraft-deploy.service); if [ "$state" = "inactive" ]; then sudo systemctl status minecraft-deploy.service --no-pager; exit 0; fi; sleep 5; done; sudo journalctl -u minecraft-deploy.service -n 100 --no-pager; exit 1'
