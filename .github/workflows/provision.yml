name: Provision VPS

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user ansible ansible-lint
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Build inventory
        run: |
          mkdir -p ansible/inventory/production
          cat > ansible/inventory/production/hosts.yml <<EOF
          all:
            children:
              minecraft_servers:
                hosts:
                  minecraft-prod:
                    ansible_host: ${{ secrets.VPS_HOST }}
                    ansible_user: ${{ secrets.VPS_USER }}
                    ansible_ssh_private_key_file: ~/.ssh/deploy_key
          EOF
      - name: Verify SSH access
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" true
      - name: Run Ansible bootstrap
        working-directory: ansible
        run: ansible-playbook --private-key ~/.ssh/deploy_key playbooks/bootstrap.yml
      - name: Upload repository snapshot
        run: |
          tar --exclude='.git' --exclude='.opencode' -czf /tmp/minecraft-infra.tgz .
          scp -i ~/.ssh/deploy_key /tmp/minecraft-infra.tgz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/minecraft-infra.tgz"
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo mkdir -p /srv/minecraft/repo && sudo tar -xzf /tmp/minecraft-infra.tgz -C /srv/minecraft/repo && sudo chown -R root:root /srv/minecraft/repo'
