name: Force Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type FORCE_DEPLOY to bypass player wait
        required: true

jobs:
  force-deploy:
    if: inputs.confirm == 'FORCE_DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          first_line=$(head -n 1 ~/.ssh/deploy_key)
          case "$first_line" in
            "-----BEGIN "*" PRIVATE KEY-----") ;;
            *) echo "VPS_SSH_KEY is not an OpenSSH/PEM private key (first line: ${first_line:0:32})"; exit 1 ;;
          esac
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Force deployment
        env:
          DEPLOY_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          archive="/tmp/minecraft-infra-${DEPLOY_REQUEST_ID}.tgz"
          request_dir="/srv/minecraft/deploy-requests/${DEPLOY_REQUEST_ID}"
          remote_archive="/tmp/minecraft-infra-${DEPLOY_REQUEST_ID}.tgz"
          tar --exclude='.git' --exclude='.opencode' -czf "$archive" .
          scp -i ~/.ssh/deploy_key "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "sudo mkdir -p '$request_dir' && sudo tar -xzf '$remote_archive' -C '$request_dir' && sudo rm -f '$remote_archive' && sudo chown -R root:root '$request_dir'"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd '$request_dir' && sudo DEPLOY_REQUEST_CLEANUP_REPO=true '$request_dir/scripts/deploy-request.sh' --force"
