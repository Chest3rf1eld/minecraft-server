minecraft_domain: minecraft.nikchester.ru
minecraft_user: minecraft
minecraft_group: minecraft
minecraft_root: /srv/minecraft
minecraft_bin_dir: /opt/minecraft/bin
minecraft_config_dir: /etc/minecraft
minecraft_secret_dir: /etc/minecraft/secrets
minecraft_rcon_port: 25575
minecraft_server_port: 25565
minecraft_java_xms: 2G
minecraft_java_xmx: 3G
minecraft_java_major: 25
# minecraft_java_xmx alone can approach total VPS RAM once JVM off-heap
# overhead is counted; this is a safety net, not primary memory (see
# vm.swappiness in the base role).
minecraft_swap_size: 2G
minecraft_max_players: 5
minecraft_view_distance: 8
minecraft_simulation_distance: 6
minecraft_difficulty: normal
minecraft_gamemode: survival
minecraft_enable_command_block: false
minecraft_pvp: true
minecraft_disk_warning_percent: 80
minecraft_disk_critical_percent: 90
# The actual remote name comes from whatever section the operator's rclone.conf
# secret defines (see scripts/lib.sh:rclone_remote_name); these are illustrative only.
minecraft_backup_remote: "<rclone-remote-name>:minecraft-restic"
minecraft_restic_repo: "rclone:<rclone-remote-name>:minecraft-restic"
