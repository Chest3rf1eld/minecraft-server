---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - python3
      - python3-yaml
      - python3-venv
      - sqlite3
      - unzip
      - ufw
    state: present
    update_cache: true

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s+'
    line: PermitRootLogin no
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Disable password SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s+'
    line: PasswordAuthentication no
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Ensure pubkey SSH authentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication\s+'
    line: PubkeyAuthentication yes
    validate: sshd -t -f %s
  notify: Restart ssh

# Java is run with -Xmx3G (see minecraft.service) on a VPS with well under
# 4G of total RAM, which leaves very little headroom for the JVM's own
# off-heap overhead (metaspace, thread stacks, GC structures) and everything
# else running (restic during backups, sshd, etc.), and there is no swap at
# all otherwise. Chunk pregeneration is memory-heavy enough that this was
# observed getting tight in practice.
- name: Check if swap file already exists
  ansible.builtin.stat:
    path: /swapfile
  register: base_swapfile_stat

- name: Create swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ minecraft_swap_size }} /swapfile
  when: not base_swapfile_stat.stat.exists
  changed_when: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: '0600'
    owner: root
    group: root

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not base_swapfile_stat.stat.exists
  changed_when: true

- name: Check currently active swaps
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: base_active_swaps
  changed_when: false

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in base_active_swaps.stdout"
  changed_when: true

- name: Persist swap file in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: /swapfile none swap sw 0 0

- name: Prefer RAM over swap (swap is a safety net, not primary memory)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-minecraft-swappiness.conf
    content: |
      vm.swappiness=10
    mode: '0644'
  notify: Apply swappiness
