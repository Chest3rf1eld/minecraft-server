---
- name: Allow SSH
  ansible.builtin.command: ufw allow 22/tcp
  changed_when: false

- name: Allow Minecraft
  ansible.builtin.command: ufw allow {{ minecraft_server_port }}/tcp
  changed_when: false

- name: Deny incoming by default
  ansible.builtin.command: ufw default deny incoming
  changed_when: false

- name: Allow outgoing by default
  ansible.builtin.command: ufw default allow outgoing
  changed_when: false

- name: Enable firewall
  ansible.builtin.command: ufw --force enable
  changed_when: false
